<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ahmed Viggle Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); height: 100vh; overflow: hidden; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
    .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; }
    .progress-bar-fill { transition: width 0.2s linear; }
</style>
</head>
<body class="bg-[#0f172a]">
    <header class="p-4 glass-panel flex justify-between items-center z-10 shadow-lg">
        <div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">Ahmed Viggle Pro</h1>
            <p class="text-[10px] text-gray-400">منصة Viggle API V1 الشاملة</p>
        </div>
        <div class="flex gap-2">
            <button onclick="showProfile()" class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center hover:bg-gray-700 transition">
                <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path></svg>
            </button>
        </div>
    </header>

    <main id="main-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
        <div class="grid grid-cols-1 gap-3">
            <a href="#" onclick="promptTask('h3-text', 'فيديو من نص')" class="block bg-gradient-to-r from-purple-600 to-pink-500 p-4 rounded-xl shadow-lg relative overflow-hidden active:scale-95 transition-transform">
                <h2 class="text-lg font-bold mb-1">🎬 فيديو من نص</h2>
                <p class="text-xs opacity-90">توليد فيديو من وصف نصي</p>
            </a>
            <a href="#" onclick="promptTask('h3-first', 'فيديو من صورة')" class="block bg-gradient-to-r from-emerald-500 to-blue-500 p-4 rounded-xl shadow-lg relative overflow-hidden active:scale-95 transition-transform">
                <h2 class="text-lg font-bold mb-1">🖼️ فيديو من صورة</h2>
                <p class="text-xs opacity-90">توليد فيديو من إطار أول</p>
            </a>
        </div>
        <h3 class="text-sm font-bold text-gray-400 mt-4 mb-2">جميع الخدمات (21)</h3>
        <div class="grid grid-cols-3 gap-2" id="services-grid"></div>
    </main>

    <div id="profile-page" class="fixed inset-0 bg-[#0f172a] z-40 hidden flex-col">
        <header class="p-4 glass-panel flex items-center gap-3">
            <button onclick="hideProfile()" class="p-2 bg-gray-800 rounded-lg text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg></button>
            <h1 class="text-lg font-bold">ملفي الشخصي (المهام)</h1>
        </header>
        <main class="flex-1 overflow-y-auto p-4 space-y-3" id="tasks-list"></main>
    </div>

    <div id="input-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] rounded-2xl w-full max-w-sm p-6 border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-4" id="input-title">جاري التحميل...</h3>
            <textarea id="input-prompt" class="w-full bg-[#0f172a] border border-gray-700 rounded-lg p-3 text-white mb-4 outline-none focus:border-purple-500 h-24" placeholder="اكتب هنا..."></textarea>
            <div class="flex gap-2">
                <button onclick="submitTask()" class="flex-1 bg-purple-600 text-white py-2 rounded-lg font-bold">إرسال</button>
                <button onclick="closeInputModal()" class="flex-1 bg-gray-700 text-white py-2 rounded-lg">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="download-modal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-white truncate" id="dl-title">جاري التحميل...</h3>
                <button onclick="closeDownloadModal()" class="text-gray-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-3 mb-2 overflow-hidden"><div id="dl-progress" class="bg-gradient-to-r from-purple-500 to-pink-500 h-3 rounded-full progress-bar-fill" style="width: 0%"></div></div>
            <div class="flex justify-between text-xs text-gray-300 mt-1"><span id="dl-percent">0%</span><span id="dl-size">0 MB / 0 MB</span></div>
            <div class="flex justify-between text-xs text-gray-500 mt-1"><span id="dl-speed">0 MB/s</span><span id="dl-status">جاري الاتصال...</span></div>
        </div>
    </div>

    <script>
        let API_KEY = localStorage.getItem('viggle_api_key') || 'sk-F9fAhJIaljhw2qaSLGQcQPD11NZOPQqew5eDdIcl6XKDV';
        const API_BASE = 'https://apis.viggle.ai/v1';
        let currentTask = null;
        const services = [
            { id: 'mix', title: 'Video Remix', icon: '🎬', endpoint: 'mixes' },
            { id: 'editor', title: 'Editor', icon: '✂️', endpoint: 'edits' },
            { id: 'mic', title: 'Mic', icon: '🎤', endpoint: 'mics' },
            { id: 'rap', title: 'Rap', icon: '🎵', endpoint: 'raps' },
            { id: 'live', title: 'Live', icon: '📹', endpoint: 'lives' },
            { id: 'looklab', title: 'Look Lab', icon: '✨', endpoint: 'looks' },
            { id: 'char-2d', title: 'Character 2D', icon: '👤', endpoint: 'characters/2d' },
            { id: 'char-3d', title: 'Character 3D', icon: '🧊', endpoint: 'characters/3d' },
            { id: 'motion-2d', title: 'Motion 2D', icon: '💃', endpoint: 'motions/2d' },
            { id: 'motion-3d', title: 'Motion 3D', icon: '🕺', endpoint: 'motions/3d' },
            { id: 'text-motion', title: 'Text to Motion', icon: '🔤', endpoint: 'motions/text' },
            { id: 'import-motion', title: 'Import Motion', icon: '📄', endpoint: 'motions/import' },
            { id: 'h3-text', title: 'H3 Video (Text)', icon: '📝', endpoint: 'videos' },
            { id: 'h3-first', title: 'H3 (First Frame)', icon: '🖼️', endpoint: 'videos' },
            { id: 'h3-first-last', title: 'H3 (First+Last)', icon: '🎞️', endpoint: 'videos' },
            { id: 'h3-reference', title: 'H3 (Reference)', icon: '🔗', endpoint: 'videos' },
            { id: 'animate', title: 'Viggle Animate', icon: '🏃', endpoint: 'animates' },
            { id: 'viggle-image', title: 'Viggle Image', icon: '🎨', endpoint: 'images' },
            { id: 'scene-pano', title: 'Scene Pano', icon: '🌍', endpoint: 'scenes/pano' },
            { id: 'scene-custom', title: 'Scene Custom', icon: '🏞️', endpoint: 'scenes/custom' },
            { id: 'upscale', title: 'Upscale', icon: '🔍', endpoint: 'upscales' }
        ];
        const grid = document.getElementById('services-grid');
        services.forEach(s => {
            grid.innerHTML += `<div onclick="promptTask('${s.id}', '${s.title}')" class="bg-[#1e293b] p-3 rounded-xl flex flex-col items-center justify-center text-center cursor-pointer border border-gray-700 active:scale-95 transition-transform"><span class="text-2xl mb-1">${s.icon}</span><h4 class="font-bold text-[11px] leading-tight">${s.title}</h4></div>`;
        });
        function promptTask(id, title) {
            currentTask = { id, title };
            document.getElementById('input-title').innerText = title;
            document.getElementById('input-prompt').value = '';
            document.getElementById('input-modal').classList.remove('hidden');
            document.getElementById('input-modal').classList.add('flex');
        }
        function closeInputModal() { document.getElementById('input-modal').classList.add('hidden'); document.getElementById('input-modal').classList.remove('flex'); currentTask = null; }
        async function submitTask() {
            const prompt = document.getElementById('input-prompt').value.trim();
            if(!prompt) return alert('الرجاء إدخال وصف!');
            const taskData = currentTask;
            closeInputModal();
            const taskId = Date.now().toString();
            let tasks = getTasks();
            tasks.unshift({ id: taskId, serviceId: taskData.id, title: taskData.title, prompt: prompt, status: 'pending', createdAt: new Date().toLocaleTimeString('ar-EG'), resultUrl: null });
            saveTasks(tasks);
            alert(`✅ تم إرسال طلبك لـ ${taskData.title}.`);
            try {
                const serviceInfo = services.find(s => s.id === taskData.id);
                const formData = new FormData(); formData.append('prompt', prompt); formData.append('quality', 'high');
                const res = await fetch(`${API_BASE}/${serviceInfo.endpoint}`, { method: 'POST', headers: { 'Authorization': `Bearer ${API_KEY}` }, body: formData });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const apiTaskId = data.id || data.task_id;
                if(apiTaskId) { updateTask(taskId, { apiId: apiTaskId }); pollTaskStatus(taskId, apiTaskId, serviceInfo.endpoint); } else { throw new Error("No Task ID"); }
            } catch (error) { updateTask(taskId, { status: 'failed' }); alert(`❌ فشل الاتصال.`); }
        }
        async function pollTaskStatus(localTaskId, apiTaskId, endpoint) {
            let attempts = 0;
            const interval = setInterval(async () => {
                attempts++; if(attempts > 60) { clearInterval(interval); updateTask(localTaskId, { status: 'failed' }); return; }
                try {
                    const res = await fetch(`${API_BASE}/${endpoint}/${apiTaskId}`, { headers: { 'Authorization': `Bearer ${API_KEY}` } });
                    if(res.ok) { const data = await res.json(); if(data.status === 'ready' || data.status === 'completed') { clearInterval(interval); updateTask(localTaskId, { status: 'completed', resultUrl: data.video_url || data.url || data.image_url }); } else if(data.status === 'failed') { clearInterval(interval); updateTask(localTaskId, { status: 'failed' }); } }
                } catch(e) {}
            }, 5000);
        }
        function getTasks() { return JSON.parse(localStorage.getItem('viggle_tasks') || '[]'); }
        function saveTasks(tasks) { localStorage.setItem('viggle_tasks', JSON.stringify(tasks)); }
        function updateTask(id, updates) { let tasks = getTasks(); const idx = tasks.findIndex(t => t.id === id); if(idx > -1) { tasks[idx] = { ...tasks[idx], ...updates }; saveTasks(tasks); } }
        function showProfile() { renderTasks(); document.getElementById('profile-page').classList.remove('hidden'); document.getElementById('profile-page').classList.add('flex'); }
        function hideProfile() { document.getElementById('profile-page').classList.add('hidden'); document.getElementById('profile-page').classList.remove('flex'); }
        function renderTasks() {
            const list = document.getElementById('tasks-list'); const tasks = getTasks();
            if (tasks.length === 0) { list.innerHTML = `<div class="text-center text-gray-500 mt-10">لا توجد مهام حتى الآن.</div>`; return; }
            list.innerHTML = tasks.map(t => `<div class="bg-[#1e293b] p-4 rounded-xl border border-gray-700"><div class="flex justify-between items-start mb-2"><h3 class="font-bold text-sm text-white truncate w-2/3">${t.title}</h3><span class="text-[10px] px-2 py-1 rounded-full ${t.status === 'completed' ? 'bg-green-500/20 text-green-400' : t.status === 'failed' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400'}">${t.status === 'completed' ? '✅ مكتمل' : t.status === 'failed' ? '❌ فشل' : '⏳ جاري المعالجة'}</span></div><p class="text-[10px] text-gray-400 mb-3 truncate">${t.prompt}</p>${t.status === 'completed' && t.resultUrl ? `<button onclick="downloadFile('${t.resultUrl}', '${t.title}.mp4')" class="w-full bg-purple-600 hover:bg-purple-500 text-white text-xs py-2 rounded-lg font-bold transition flex justify-center items-center gap-2">تحميل</button>` : t.status === 'failed' ? `<div class="text-[10px] text-red-400">حدث خطأ.</div>` : `<div class="w-full bg-gray-700 h-1 rounded-full overflow-hidden mt-2"><div class="bg-purple-500 h-1 rounded-full animate-pulse" style="width: 100%"></div></div>`}</div>`).join('');
        }
        let downloadAbortController = null;
        function closeDownloadModal() { document.getElementById('download-modal').classList.add('hidden'); document.getElementById('download-modal').classList.remove('flex'); if (downloadAbortController) { downloadAbortController.abort(); downloadAbortController = null; } }
        async function downloadFile(url, filename) {
            const modal = document.getElementById('download-modal'); modal.classList.remove('hidden'); modal.classList.add('flex');
            document.getElementById('dl-title').innerText = filename; document.getElementById('dl-progress').style.width = '0%'; document.getElementById('dl-percent').innerText = '0%'; document.getElementById('dl-size').innerText = '0 MB / 0 MB'; document.getElementById('dl-speed').innerText = '0 MB/s'; document.getElementById('dl-status').innerText = 'جاري الاتصال...';
            try {
                downloadAbortController = new AbortController(); const response = await fetch(url, { signal: downloadAbortController.signal }); if (!response.ok) throw new Error('فشل');
                const contentLength = response.headers.get('content-length'); const total = parseInt(contentLength || '0', 10); const reader = response.body.getReader(); const chunks = []; let received = 0; let lastTime = Date.now(); let lastReceived = 0;
                document.getElementById('dl-status').innerText = 'جاري التحميل...';
                while (true) {
                    const { done, value } = await reader.read(); if (done) break; chunks.push(value); received += value.length;
                    const now = Date.now(); const timeDiff = (now - lastTime) / 1000;
                    if (timeDiff >= 0.1) { const speed = (received - lastReceived) / timeDiff; const totalMB = (total / (1024 * 1024)).toFixed(2); const receivedMB = (received / (1024 * 1024)).toFixed(2); const speedMB = (speed / (1024 * 1024)).toFixed(2); const percent = total ? Math.round((received / total) * 100) : 0; document.getElementById('dl-progress').style.width = `${percent}%`; document.getElementById('dl-percent').innerText = `${percent}%`; document.getElementById('dl-size').innerText = `${receivedMB} MB / ${totalMB} MB`; document.getElementById('dl-speed').innerText = `${speedMB} MB/s`; lastTime = now; lastReceived = received; }
                }
                document.getElementById('dl-status').innerText = 'تم التحميل!'; const blob = new Blob(chunks); const blobUrl = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = blobUrl; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(blobUrl); setTimeout(() => closeDownloadModal(), 1500);
            } catch (error) { if (error.name === 'AbortError') return; document.getElementById('dl-status').innerText = 'حدث خطأ!'; }
        }
    </script>
</body>
</html>
