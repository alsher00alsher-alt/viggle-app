<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ahmed Viggle Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); height: 100vh; overflow: hidden; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
    .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; }
    .progress-bar-fill { transition: width 0.2s linear; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: inherit; transition: 0.2s; }
    .card:active { transform: scale(0.95); border-color: #8b5cf6; }
    .card-icon { margin-bottom: 10px; }
    .card-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    .card-desc { font-size: 11px; color: #94a3b8; line-height: 1.2; }
</style>
</head>
<body class="bg-[#0f172a]">

    <!-- Header -->
    <header class="p-4 glass-panel flex justify-between items-center z-10 shadow-lg">
        <div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">Ahmed Viggle Pro</h1>
            <p class="text-[10px] text-gray-400">جميع خدمات Viggle API V1</p>
        </div>
        <div class="flex gap-2">
            <button onclick="showProfile()" class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center hover:bg-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </button>
            <button onclick="openSettings()" class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center hover:bg-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
    </header>

    <!-- Main Content -->
    <main id="main-content" class="flex-1 overflow-y-auto p-4 space-y-4 pb-24">
        
        <!-- Banners (نفس اللي في الصورة اللي أنت بعتها بالظبط) -->
        <div class="grid grid-cols-1 gap-3">
            <a href="#" onclick="promptTask('h3-text', 'فيديو من نص')" class="block bg-gradient-to-r from-purple-600 to-pink-500 p-5 rounded-2xl shadow-lg relative overflow-hidden active:scale-95 transition-transform">
                <div class="relative z-10">
                    <h2 class="text-xl font-bold mb-1">🎬 فيديو من نص</h2>
                    <p class="text-sm opacity-90">توليد فيديو من وصف نصي</p>
                </div>
                <div class="absolute -left-4 -bottom-4 opacity-20">
                    <svg class="w-24 h-24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>
                </div>
            </a>

            <a href="#" onclick="promptTask('h3-first', 'فيديو من صورة')" class="block bg-gradient-to-r from-emerald-500 to-blue-500 p-5 rounded-2xl shadow-lg relative overflow-hidden active:scale-95 transition-transform">
                <div class="relative z-10">
                    <h2 class="text-xl font-bold mb-1">🖼️ فيديو من صورة</h2>
                    <p class="text-sm opacity-90">توليد فيديو من إطار أول</p>
                </div>
                <div class="absolute -left-4 -bottom-4 opacity-20">
                    <svg class="w-24 h-24" fill="none" stroke="currentColor" viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>
                </div>
            </a>
        </div>

        <!-- Services Grid -->
        <h3 class="text-sm font-bold text-gray-400 mt-4 mb-2">جميع الخدمات (21)</h3>
        <div class="grid grid-cols-3 gap-2" id="services-grid"></div>
    </main>

    <!-- Profile Page -->
    <div id="profile-page" class="fixed inset-0 bg-[#0f172a] z-40 hidden flex-col">
        <header class="p-4 glass-panel flex items-center gap-3">
            <button onclick="hideProfile()" class="p-2 bg-gray-800 rounded-lg text-white"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg></button>
            <h1 class="text-lg font-bold">ملفي الشخصي (المهام)</h1>
        </header>
        <main class="flex-1 overflow-y-auto p-4 space-y-3" id="tasks-list"></main>
    </div>

    <!-- Settings Modal (فيها API, Balance, Vercel) -->
    <div id="settings-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] rounded-2xl w-full max-w-sm p-6 border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-4">الإعدادات</h3>
            
            <label class="text-sm text-gray-400 block mb-2">Viggle API Key</label>
            <input type="password" id="api-key-input" class="w-full bg-[#0f172a] border border-gray-700 rounded-lg p-3 text-white mb-4 outline-none focus:border-purple-500" placeholder="sk-..." dir="ltr">
            
            <div class="flex gap-2 mb-4">
                <button onclick="checkBalance()" class="flex-1 bg-blue-600 text-white py-2 rounded-lg font-bold text-sm">فحص الرصيد</button>
                <span id="balance-display" class="flex-1 bg-gray-800 text-center py-2 rounded-lg text-sm flex items-center justify-center">جاري الفحص...</span>
            </div>

            <a href="https://vercel.com/dashboard" target="_blank" class="block w-full text-center bg-gray-700 text-white py-2 rounded-lg font-bold mb-4 hover:bg-gray-600">لوحة تحكم Vercel</a>

            <div class="flex gap-2">
                <button onclick="saveSettings()" class="flex-1 bg-purple-600 text-white py-2 rounded-lg font-bold">حفظ</button>
                <button onclick="closeSettings()" class="flex-1 bg-gray-700 text-white py-2 rounded-lg">إغلاق</button>
            </div>
        </div>
    </div>

    <!-- Task Input Modal -->
    <div id="input-modal" class="fixed inset-0 bg-black/80 z-50 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] rounded-2xl w-full max-w-sm p-6 border border-gray-700">
            <h3 class="text-lg font-bold text-white mb-4" id="input-title">جاري التحميل...</h3>
            <textarea id="input-prompt" class="w-full bg-[#0f172a] border border-gray-700 rounded-lg p-3 text-white mb-4 outline-none focus:border-purple-500 h-24" placeholder="اكتب هنا..."></textarea>
            <div class="flex gap-2">
                <button onclick="submitTask()" class="flex-1 bg-purple-600 text-white py-2 rounded-lg font-bold">إرسال</button>
                <button onclick="closeInputModal()" class="flex-1 bg-gray-700 text-white py-2 rounded-lg">إلغاء</button>
            </div>
        </div>
    </div>

    <!-- Download Modal -->
    <div id="download-modal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-gray-700">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-sm font-bold text-white truncate" id="dl-title">جاري التحميل...</h3>
                <button onclick="closeDownloadModal()" class="text-gray-400 hover:text-white"><svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
            </div>
            <div class="w-full bg-gray-700 rounded-full h-3 mb-2 overflow-hidden"><div id="dl-progress" class="bg-gradient-to-r from-purple-500 to-pink-500 h-3 rounded-full progress-bar-fill" style="width: 0%"></div></div>
            <div class="flex justify-between text-xs text-gray-300 mt-1"><span id="dl-percent">0%</span><span id="dl-size">0 MB / 0 MB</span></div>
            <div class="flex justify-between text-xs text-gray-500 mt-1"><span id="dl-speed">0 MB/s</span><span id="dl-status">جاري الاتصال...</span></div>
        </div>
    </div>

        const API_BASE = 'https://apis.viggle.ai/v1';

            { id: 'scene-pano', title: 'Scene (Pano)', icon: '🌍', endpoint: 'scenes/pano', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>', color: '#8b5cf6' },
            { id: 'scene-custom', title: 'Scene (Custom)', icon: '🏞️', endpoint: 'scenes/custom', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"></path><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"></path></svg>', color: '#10b981' },
            { id: 'upscale', title: 'Upscale Video', icon: '🔍', endpoint: 'upscales', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path><path d="M21 3v5h-5"></path><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"></path><path d="M8 16H3v5"></path></svg>', color: '#3b82f6' }
        ];

        // Render Grid (بنفس كلاسات الـ CSS اللي في ملفك)
        const grid = document.getElementById('services-grid');
        services.forEach(s => {
            grid.innerHTML += `
                <div onclick="promptTask('${s.id}', '${s.title}')" class="card">
                    <div class="card-icon" style="color:${s.color}">${s.svg}</div>
                    <div class="card-title">${s.title}</div>
                </div>
            `;
        });

        // Settings & Balance
        function openSettings() {
            document.getElementById('api-key-input').value = API_KEY;
            document.getElementById('settings-modal').classList.remove('hidden');
            document.getElementById('settings-modal').classList.add('flex');
        }
        function closeSettings() {
            document.getElementById('settings-modal').classList.add('hidden');
            document.getElementById('settings-modal').classList.remove('flex');
        }
        function saveSettings() {
            const val = document.getElementById('api-key-input').value.trim();
            if(val) {
                API_KEY = val;
                localStorage.setItem('viggle_api_key', API_KEY);
                alert('تم حفظ مفتاح API بنجاح!');
            }
            closeSettings();
        }
        async function checkBalance() {
            const key = document.getElementById('api-key-input').value.trim();
            const display = document.getElementById('balance-display');
            if(!key) return alert('أدخل الـ API Key أولاً');
            display.innerText = 'جاري الفحص...';
            try {
                const res = await fetch(`${API_BASE}/user`, { headers: { 'Authorization': `Bearer ${key}` } });
                if(res.ok) {
                    const data = await res.json();
                    display.innerText = `الرصيد: ${data.credits || data.balance || 'غير معروف'}`;
                } else {
                    display.innerText = 'خطأ في المفتاح';
                }
            } catch {
                display.innerText = 'فشل الاتصال';
            }
        }

        // Task Logic
        function promptTask(id, title) {
            if(!API_KEY) return alert('الرجاء ضبط API Key من الإعدادات أولاً!');
            currentTask = { id, title };
            document.getElementById('input-title').innerText = title;
            document.getElementById('input-prompt').value = '';
            document.getElementById('input-modal').classList.remove('hidden');
            document.getElementById('input-modal').classList.add('flex');
        }
        function closeInputModal() { document.getElementById('input-modal').classList.add('hidden'); document.getElementById('input-modal').classList.remove('flex'); currentTask = null; }
        
        async function submitTask() {
            const prompt = document.getElementById('input-prompt').value.trim();
            if(!prompt) return alert('الرجاء إدخال وصف!');
            const taskData = currentTask;
            closeInputModal();
            
            const taskId = Date.now().toString();
            let tasks = getTasks();
            tasks.unshift({ id: taskId, serviceId: taskData.id, title: taskData.title, prompt: prompt, status: 'pending', createdAt: new Date().toLocaleTimeString('ar-EG'), resultUrl: null });
            saveTasks(tasks);
            alert(`✅ تم إرسال طلبك لـ ${taskData.title}.`);
            
            try {
                const serviceInfo = services.find(s => s.id === taskData.id);
                const formData = new FormData(); formData.append('prompt', prompt); formData.append('quality', 'high');
                const res = await fetch(`${API_BASE}/${serviceInfo.endpoint}`, { method: 'POST', headers: { 'Authorization': `Bearer ${API_KEY}` }, body: formData });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const apiTaskId = data.id || data.task_id;
                if(apiTaskId) { updateTask(taskId, { apiId: apiTaskId }); pollTaskStatus(taskId, apiTaskId, serviceInfo.endpoint); } else { throw new Error("No Task ID"); }
            } catch (error) { updateTask(taskId, { status: 'failed' }); alert(`❌ فشل الاتصال. تأكد من الـ API Key.`); }
        }

        async function pollTaskStatus(localTaskId, apiTaskId, endpoint) {
            let attempts = 0;
            const interval = setInterval(async () => {
                attempts++; if(attempts > 60) { clearInterval(interval); updateTask(localTaskId, { status: 'failed' }); return; }
                try {
                    const res = await fetch(`${API_BASE}/${endpoint}/${apiTaskId}`, { headers: { 'Authorization': `Bearer ${API_KEY}` } });
                    if(res.ok) { const data = await res.json(); if(data.status === 'ready' || data.status === 'completed') { clearInterval(interval); updateTask(localTaskId, { status: 'completed', resultUrl: data.video_url || data.url || data.image_url }); } else if(data.status === 'failed') { clearInterval(interval); updateTask(localTaskId, { status: 'failed' }); } }
                } catch(e) {}
            }, 5000);
        }

        // Storage & Profile
        function getTasks() { return JSON.parse(localStorage.getItem('viggle_tasks') || '[]'); }
        function saveTasks(tasks) { localStorage.setItem('viggle_tasks', JSON.stringify(tasks)); }
        function updateTask(id, updates) { let tasks = getTasks(); const idx = tasks.findIndex(t => t.id === id); if(idx > -1) { tasks[idx] = { ...tasks[idx], ...updates }; saveTasks(tasks); } }
        function showProfile() { renderTasks(); document.getElementById('profile-page').classList.remove('hidden'); document.getElementById('profile-page').classList.add('flex'); }
        function hideProfile() { document.getElementById('profile-page').classList.add('hidden'); document.getElementById('profile-page').classList.remove('flex'); }
        function renderTasks() {
            const list = document.getElementById('tasks-list'); const tasks = getTasks();
            if (tasks.length === 0) { list.innerHTML = `<div class="text-center text-gray-500 mt-10">لا توجد مهام حتى الآن.</div>`; return; }
            list.innerHTML = tasks.map(t => `<div class="bg-[#1e293b] p-4 rounded-xl border border-gray-700"><div class="flex justify-between items-start mb-2"><h3 class="font-bold text-sm text-white truncate w-2/3">${t.title}</h3><span class="text-[10px] px-2 py-1 rounded-full ${t.status === 'completed' ? 'bg-green-500/20 text-green-400' : t.status === 'failed' ? 'bg-red-500/20 text-red-400' : 'bg-yellow-500/20 text-yellow-400'}">${t.status === 'completed' ? '✅ مكتمل' : t.status === 'failed' ? '❌ فشل' : '⏳ جاري المعالجة'}</span></div><p class="text-[10px] text-gray-400 mb-3 truncate">${t.prompt}</p>${t.status === 'completed' && t.resultUrl ? `<button onclick="downloadFile('${t.resultUrl}', '${t.title}.mp4')" class="w-full bg-purple-600 hover:bg-purple-500 text-white text-xs py-2 rounded-lg font-bold transition">تحميل</button>` : t.status === 'failed' ? `<div class="text-[10px] text-red-400">حدث خطأ.</div>` : `<div class="w-full bg-gray-700 h-1 rounded-full overflow-hidden mt-2"><div class="bg-purple-500 h-1 rounded-full animate-pulse" style="width: 100%"></div></div>`}</div>`).join('');
        }

        // Downloader
        let downloadAbortController = null;
        function closeDownloadModal() { document.getElementById('download-modal').classList.add('hidden'); document.getElementById('download-modal').classList.remove('flex'); if (downloadAbortController) { downloadAbortController.abort(); downloadAbortController = null; } }
        async function downloadFile(url, filename) {
            const modal = document.getElementById('download-modal'); modal.classList.remove('hidden'); modal.classList.add('flex');
            document.getElementById('dl-title').innerText = filename; document.getElementById('dl-progress').style.width = '0%'; document.getElementById('dl-percent').innerText = '0%'; document.getElementById('dl-size').innerText = '0 MB / 0 MB'; document.getElementById('dl-speed').innerText = '0 MB/s'; document.getElementById('dl-status').innerText = 'جاري الاتصال...';
            try {
                downloadAbortController = new AbortController(); const response = await fetch(url, { signal: downloadAbortController.signal }); if (!response.ok) throw new Error('فشل');
                const contentLength = response.headers.get('content-length'); const total = parseInt(contentLength || '0', 10); const reader = response.body.getReader(); const chunks = []; let received = 0; let lastTime = Date.now(); let lastReceived = 0;
                document.getElementById('dl-status').innerText = 'جاري التحميل...';
                while (true) {
                    const { done, value } = await reader.read(); if (done) break; chunks.push(value); received += value.length;
                    const now = Date.now(); const timeDiff = (now - lastTime) / 1000;
                    if (timeDiff >= 0.1) { const speed = (received - lastReceived) / timeDiff; const totalMB = (total / (1024 * 1024)).toFixed(2); const receivedMB = (received / (1024 * 1024)).toFixed(2); const speedMB = (speed / (1024 * 1024)).toFixed(2); const percent = total ? Math.round((received / total) * 100) : 0; document.getElementById('dl-progress').style.width = `${percent}%`; document.getElementById('dl-percent').innerText = `${percent}%`; document.getElementById('dl-size').innerText = `${receivedMB} MB / ${totalMB} MB`; document.getElementById('dl-speed').innerText = `${speedMB} MB/s`; lastTime = now; lastReceived = received; }
                }
                document.getElementById('dl-status').innerText = 'تم التحميل!'; const blob = new Blob(chunks); const blobUrl = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = blobUrl; a.download = filename; document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(blobUrl); setTimeout(() => closeDownloadModal(), 1500);
            } catch (error) { if (error.name === 'AbortError') return; document.getElementById('dl-status').innerText = 'حدث خطأ!'; }
        }
    </script>
