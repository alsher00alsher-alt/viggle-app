<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="viewport-fit=cover, width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Ahmed Viggle Pro</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
    @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap');
    body { font-family: 'Cairo', sans-serif; background-color: #0f172a; color: #f8fafc; margin: 0; padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); height: 100vh; overflow: hidden; display: flex; flex-direction: column; -webkit-user-select: none; user-select: none; }
    .glass-panel { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); border-bottom: 1px solid rgba(255,255,255,0.1); }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; }
    .card { background: #1e293b; border: 1px solid #334155; border-radius: 16px; padding: 20px 15px; display: flex; flex-direction: column; align-items: center; text-align: center; text-decoration: none; color: inherit; transition: 0.2s; }
    .card:active { transform: scale(0.95); border-color: #8b5cf6; }
    .card-icon { margin-bottom: 10px; }
    .card-title { font-weight: bold; font-size: 13px; margin-bottom: 4px; }
    .card-desc { font-size: 11px; color: #94a3b8; line-height: 1.2; }
    .view { display: none; flex: 1; overflow-y: auto; padding: 1rem; padding-bottom: 6rem; }
    .view.active { display: flex; flex-direction: column; }
    .progress-bar-fill { transition: width 0.2s linear; }
</style>
</head>
<body class="bg-[#0f172a]">

    <!-- Header (ثابت) -->
    <header class="p-4 glass-panel flex justify-between items-center z-10 shadow-lg">
        <div>
            <h1 class="text-xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-purple-400 to-pink-500">Ahmed Viggle Pro</h1>
            <p class="text-[10px] text-gray-400">جميع خدمات Viggle API V1</p>
        </div>
        <div class="flex gap-2">
            <button onclick="showView('profile-view')" class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center hover:bg-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            </button>
            <button onclick="showView('settings-view')" class="w-9 h-9 rounded-full bg-gray-800 flex items-center justify-center hover:bg-gray-700 transition">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-settings"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            </button>
        </div>
    </header>

    <!-- 1. الصفحة الرئيسية (Home View) -->
    <main id="home-view" class="view active">
        <div class="grid grid-cols-1 gap-3 mb-4">
            <a href="#" onclick="openService('h3-text', 'فيديو من نص')" class="block bg-gradient-to-r from-purple-600 to-pink-500 p-5 rounded-2xl shadow-lg relative overflow-hidden active:scale-95 transition-transform">
                <div class="relative z-10"><h2 class="text-xl font-bold mb-1">🎬 فيديو من نص</h2><p class="text-sm opacity-90">توليد فيديو من وصف نصي</p></div>
            </a>
            <a href="#" onclick="openService('h3-first', 'فيديو من صورة')" class="block bg-gradient-to-r from-emerald-500 to-blue-500 p-5 rounded-2xl shadow-lg relative overflow-hidden active:scale-95 transition-transform">
                <div class="relative z-10"><h2 class="text-xl font-bold mb-1">🖼️ فيديو من صورة</h2><p class="text-sm opacity-90">توليد فيديو من إطار أول</p></div>
            </a>
        </div>
        <h3 class="text-sm font-bold text-gray-400 mb-2">جميع الخدمات (21)</h3>
        <div class="grid grid-cols-3 gap-2" id="services-grid"></div>
    </main>

    <!-- 2. صفحة الخدمة (Service View) -->
    <main id="service-view" class="view">
        <button onclick="showView('home-view')" class="mb-4 text-sm text-gray-400 flex items-center gap-1"><svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg> رجوع للرئيسية</button>
        <h2 id="service-title" class="text-2xl font-bold mb-4 text-purple-400">اسم الخدمة</h2>
        
        <!-- صندوق رفع الملفات -->
        <div id="upload-container" class="mb-4 hidden">
            <label class="block text-sm text-gray-400 mb-2">إرفاق صورة / فيديو</label>
            <input type="file" id="file-input" class="w-full text-sm text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-sm file:font-semibold file:bg-purple-600 file:text-white hover:file:bg-purple-500"/>
            <div id="file-preview" class="mt-2 text-xs text-green-400"></div>
        </div>

        <textarea id="service-prompt" class="w-full bg-[#1e293b] border border-gray-700 rounded-xl p-4 text-white outline-none focus:border-purple-500 h-32 mb-4" placeholder="اكتب وصف المشهد هنا..."></textarea>
        
        <button onclick="submitServiceTask()" id="submit-btn" class="w-full bg-purple-600 hover:bg-purple-500 text-white font-bold py-3 rounded-xl transition mb-6">إرسال الطلب</button>

        <!-- مكان عرض النتيجة (فيديو أو صورة) -->
        <div id="result-container" class="hidden bg-black rounded-xl overflow-hidden mb-4 border border-gray-700">
            <video id="result-video" controls autoplay class="w-full h-auto"></video>
            <img id="result-image" class="w-full h-auto hidden" />
        </div>
        <button onclick="downloadResult()" id="download-btn" class="hidden w-full bg-gray-700 text-white font-bold py-3 rounded-xl">تحميل الملف</button>
    </main>

    <!-- 3. صفحة الملف الشخصي (Profile View) -->
    <main id="profile-view" class="view">
        <h2 class="text-2xl font-bold mb-4 text-purple-400">ملفي الشخصي (المهام)</h2>
        <div id="tasks-list" class="space-y-3"></div>
    </main>

    <!-- 4. صفحة الإعدادات (Settings View) -->
    <main id="settings-view" class="view">
        <h2 class="text-2xl font-bold mb-4 text-purple-400">الإعدادات</h2>
        <label class="block text-sm text-gray-400 mb-2">Viggle API Key</label>
        <input type="password" id="api-key-input" class="w-full bg-[#1e293b] border border-gray-700 rounded-xl p-4 text-white mb-4 outline-none focus:border-purple-500" placeholder="sk-..." dir="ltr">
        
        <div class="flex gap-2 mb-4">
            <button onclick="checkBalance()" class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">فحص الرصيد</button>
            <span id="balance-display" class="flex-1 bg-gray-800 text-center py-3 rounded-xl text-sm flex items-center justify-center">--</span>
        </div>
        <a href="https://vercel.com/dashboard" target="_blank" class="block w-full text-center bg-gray-700 text-white py-3 rounded-xl font-bold mb-4">لوحة تحكم Vercel</a>
        <button onclick="saveSettings()" class="w-full bg-purple-600 text-white py-3 rounded-xl font-bold">حفظ المفتاح</button>
    </main>

    <!-- Download Modal (تحميل) -->
    <div id="download-modal" class="fixed inset-0 bg-black/80 z-[100] hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-[#1e293b] rounded-2xl w-full max-w-sm p-6 shadow-2xl border border-gray-700">
            <h3 class="text-sm font-bold text-white truncate mb-4" id="dl-title">جاري التحميل...</h3>
            <div class="w-full bg-gray-700 rounded-full h-3 mb-2"><div id="dl-progress" class="bg-purple-500 h-3 rounded-full" style="width: 0%"></div></div>
            <div class="flex justify-between text-xs text-gray-400 mt-1"><span id="dl-percent">0%</span><span id="dl-size">0 MB / 0 MB</span></div>
            <div class="text-xs text-gray-500 mt-2" id="dl-status">جاري الاتصال...</div>
        </div>
    </div>

    <script>
        let API_KEY = localStorage.getItem('viggle_api_key') || '';
        const API_BASE = 'https://apis.viggle.ai/v1';
        let currentService = null;
        let currentFile = null;
        let currentResultUrl = null;

        const services = [
            { id: 'mix', title: 'Video Remix (Mix)', icon: '🎬', endpoint: 'mixes', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-video"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>', color: '#8b5cf6', needsFile: true },
            { id: 'editor', title: 'Editor', icon: '✂️', endpoint: 'edits', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-scissors"><circle cx="6" cy="6" r="3"></circle><path d="M8.12 8.12 12 12"></path><path d="M20 4 8.12 15.88"></path><circle cx="6" cy="18" r="3"></circle><path d="M14.8 14.8 20 20"></path></svg>', color: '#ec4899', needsFile: true },
            { id: 'mic', title: 'Mic', icon: '🎤', endpoint: 'mics', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-mic"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>', color: '#10b981', needsFile: true },
            { id: 'rap', title: 'Rap', icon: '🎵', endpoint: 'raps', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-music"><path d="M9 18V5l12-2v13"></path><circle cx="6" cy="18" r="3"></circle><circle cx="18" cy="16" r="3"></circle></svg>', color: '#f59e0b', needsFile: true },
            { id: 'live', title: 'Live', icon: '📹', endpoint: 'lives', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-camera"><path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z"></path><circle cx="12" cy="13" r="3"></circle></svg>', color: '#ef4444', needsFile: false },
            { id: 'looklab', title: 'Look Lab', icon: '✨', endpoint: 'looks', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-sparkles"><path d="M9.937 15.5A2 2 0 0 0 8.5 14.063l-6.135-1.582a.5.5 0 0 1 0-.962L8.5 9.936A2 2 0 0 0 9.937 8.5l1.582-6.135a.5.5 0 0 1 .963 0L14.063 8.5A2 2 0 0 0 15.5 9.937l6.135 1.581a.5.5 0 0 1 0 .964L15.5 14.063a2 2 0 0 0-1.437 1.437l-1.582 6.135a.5.5 0 0 1-.963 0z"></path></svg>', color: '#06b6d4', needsFile: true },
            { id: 'char-2d', title: 'Character (2D)', icon: '👤', endpoint: 'characters/2d', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>', color: '#3b82f6', needsFile: true },
            { id: 'char-3d', title: 'Character (3D)', icon: '🧊', endpoint: 'characters/3d', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-cuboid"><path d="m21.12 6.4-6.05-4.06a2 2 0 0 0-2.17-.05L2.95 8.41a2 2 0 0 0-.95 1.7v5.82a2 2 0 0 0 .88 1.66l6.05 4.07a2 2 0 0 0 2.17.05l9.95-6.12a2 2 0 0 0 .95-1.7V8.06a2 2 0 0 0-.88-1.66Z"></path></svg>', color: '#8b5cf6', needsFile: true },
            { id: 'motion-2d', title: 'Motion (2D)', icon: '💃', endpoint: 'motions/2d', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-wind"><path d="M12.8 19.6A2 2 0 1 0 14 16H2"></path><path d="M17.5 8a2.5 2.5 0 1 1 2 4H2"></path><path d="M9.8 4.4A2 2 0 1 1 11 8H2"></path></svg>', color: '#10b981', needsFile: true },
            { id: 'motion-3d', title: 'Motion (3D)', icon: '🕺', endpoint: 'motions/3d', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-box"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16Z"></path></svg>', color: '#f59e0b', needsFile: true },
            { id: 'text-motion', title: 'Text to Motion', icon: '🔤', endpoint: 'motions/text', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-type"><polyline points="4 7 4 4 20 4 20 7"></polyline><line x1="9" x2="15" y1="20" y2="20"></line><line x1="12" x2="12" y1="4" y2="20"></line></svg>', color: '#06b6d4', needsFile: false },
            { id: 'import-motion', title: 'Import Motion', icon: '📄', endpoint: 'motions/import', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-file-text"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z"></path></svg>', color: '#ec4899', needsFile: true },
            { id: 'h3-text', title: 'H3 Video (Text)', icon: '📝', endpoint: 'videos', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-video"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>', color: '#8b5cf6', needsFile: false },
            { id: 'h3-first', title: 'H3 Video (First Frame)', icon: '🖼️', endpoint: 'videos', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-video"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>', color: '#3b82f6', needsFile: true },
            { id: 'h3-first-last', title: 'H3 Video (First+Last)', icon: '🎞️', endpoint: 'videos', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-video"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>', color: '#f59e0b', needsFile: true },
            { id: 'h3-reference', title: 'H3 Video (Reference)', icon: '🔗', endpoint: 'videos', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-video"><path d="m16 13 5.223 3.482a.5.5 0 0 0 .777-.416V7.87a.5.5 0 0 0-.752-.432L16 10.5"></path><rect x="2" y="6" width="14" height="12" rx="2"></rect></svg>', color: '#10b981', needsFile: true },
            { id: 'animate', title: 'Viggle Animate', icon: '🏃', endpoint: 'animates', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-user"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>', color: '#ec4899', needsFile: true },
            { id: 'viggle-image', title: 'Viggle Image', icon: '🎨', endpoint: 'images', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-image"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect><circle cx="9" cy="9" r="2"></circle><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"></path></svg>', color: '#3b82f6', needsFile: false },
            { id: 'scene-pano', title: 'Scene (Pano)', icon: '🌍', endpoint: 'scenes/pano', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path></svg>', color: '#8b5cf6', needsFile: false },
            { id: 'scene-custom', title: 'Scene (Custom)', icon: '🏞️', endpoint: 'scenes/custom', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-layers"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"></path></svg>', color: '#10b981', needsFile: true },
            { id: 'upscale', title: 'Upscale Video', icon: '🔍', endpoint: 'upscales', svg: '<svg xmlns="http://www.w3.org/2000/svg" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="lucide lucide-refresh-cw"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"></path></svg>', color: '#3b82f6', needsFile: true }
        ];

        // رندر الخدمات في الرئيسية
        const grid = document.getElementById('services-grid');
        services.forEach(s => {
            grid.innerHTML += `
                <div onclick="openService('${s.id}', '${s.title}')" class="card">
                    <div class="card-icon" style="color:${s.color}">${s.svg}</div>
                    <div class="card-title">${s.title}</div>
                </div>
            `;
        });

        // نظام التنقل بين الصفحات
        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById(viewId).classList.add('active');
            if(viewId === 'profile-view') renderTasks();
            if(viewId === 'settings-view') document.getElementById('api-key-input').value = API_KEY;
        }

        // فتح صفحة خدمة معينة
        function openService(id, title) {
            if(!API_KEY) {
                alert('الرجاء ضبط API Key من الإعدادات أولاً!');
                showView('settings-view');
                return;
            }
            currentService = services.find(s => s.id === id);
            currentFile = null;
            currentResultUrl = null;
            
            document.getElementById('service-title').innerText = title;
            document.getElementById('service-prompt').value = '';
            document.getElementById('result-container').classList.add('hidden');
            document.getElementById('download-btn').classList.add('hidden');
            
            // إظهار أو إخفاء رفع الملفات حسب الخدمة
            const uploadContainer = document.getElementById('upload-container');
            if (currentService.needsFile) {
                uploadContainer.classList.remove('hidden');
            } else {
                uploadContainer.classList.add('hidden');
            }
            document.getElementById('file-preview').innerText = '';
            document.getElementById('file-input').value = '';
            
            showView('service-view');
        }

        // التعامل مع رفع الملفات
        document.getElementById('file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if(file) {
                currentFile = file;
                document.getElementById('file-preview').innerText = `تم اختيار: ${file.name} (${(file.size / 1024 / 1024).toFixed(2)} MB)`;
            }
        });

        // إرسال المهمة من صفحة الخدمة
        async function submitServiceTask() {
            const prompt = document.getElementById('service-prompt').value.trim();
            if(!prompt) return alert('الرجاء إدخال وصف!');
            if(currentService.needsFile && !currentFile) return alert('هذه الخدمة تتطلب رفع صورة أو فيديو!');

            const btn = document.getElementById('submit-btn');
            btn.innerText = 'جاري الإرسال...';
            btn.disabled = true;

            try {
                const formData = new FormData();
                formData.append('prompt', prompt);
                formData.append('quality', 'high');
                if (currentFile) {
                    formData.append('file', currentFile);
                }

                const res = await fetch(`${API_BASE}/${currentService.endpoint}`, { 
                    method: 'POST', 
                    headers: { 'Authorization': `Bearer ${API_KEY}` }, 
                    body: formData 
                });
                
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                const data = await res.json();
                const apiTaskId = data.id || data.task_id;
                
                if(apiTaskId) {
                    pollServiceTask(apiTaskId);
                } else {
                    throw new Error("No Task ID");
                }
            } catch (error) {
                alert(`❌ فشل الاتصال. تأكد من الـ API Key والنت.`);
                btn.innerText = 'إرسال الطلب';
                btn.disabled = false;
            }
        }

        // متابعة حالة المهمة في صفحة الخدمة
        async function pollServiceTask(apiTaskId) {
            const btn = document.getElementById('submit-btn');
            btn.innerText = '⏳ جاري المعالجة (قد تستغرق دقيقة)...';
            
            let attempts = 0;
            const interval = setInterval(async () => {
                attempts++;
                if(attempts > 120) { // 10 دقائق كحد أقصى
                    clearInterval(interval);
                    alert('انتهت المهلة.');
                    btn.innerText = 'إرسال الطلب';
                    btn.disabled = false;
                    return;
                }
                
                try {
                    const res = await fetch(`${API_BASE}/${currentService.endpoint}/${apiTaskId}`, { headers: { 'Authorization': `Bearer ${API_KEY}` } });
                    if(res.ok) { 
                        const data = await res.json(); 
                        if(data.status === 'ready' || data.status === 'completed') { 
                            clearInterval(interval); 
                            const url = data.video_url || data.url || data.image_url;
                            showResult(url);
                        } else if(data.status === 'failed') { 
                            clearInterval(interval); 
                            alert('❌ فشلت المعالجة في السيرفر.');
                            btn.innerText = 'إرسال الطلب';
                            btn.disabled = false;
                        } 
                    }
                } catch(e) {}
            }, 5000);
        }

        // عرض النتيجة في مشغل الفيديو أو الصورة
        function showResult(url) {
            currentResultUrl = url;
            document.getElementById('submit-btn').innerText = 'إرسال الطلب';
            document.getElementById('submit-btn').disabled = false;
            
            const container = document.getElementById('result-container');
            const videoEl = document.getElementById('result-video');
            const imgEl = document.getElementById('result-image');
            
            container.classList.remove('hidden');
            
            if(url.match(/\.(mp4|webm|mov)/i) || currentService.endpoint.includes('videos') || currentService.endpoint.includes('animates')) {
                videoEl.src = url;
                videoEl.classList.remove('hidden');
                imgEl.classList.add('hidden');
            } else {
                imgEl.src = url;
                imgEl.classList.remove('hidden');
                videoEl.classList.add('hidden');
            }
            
            document.getElementById('download-btn').classList.remove('hidden');
        }

        // تحميل النتيجة
        function downloadResult() {
            if(!currentResultUrl) return;
            document.getElementById('download-modal').classList.remove('hidden');
            document.getElementById('download-modal').classList.add('flex');
            
            // هنا بنعمل محاكاة للتحميل (لأننا بنعرض الفيديو أصلاً)
            // بس عشان الكود يشتغل صح، هنستخدم دالة التحميل القديمة
            downloadFile(currentResultUrl, currentService.title + '.mp4');
        }

        // فحص الرصيد
        async function checkBalance() {
            const key = document.getElementById('api-key-input').value.trim();
            const display = document.getElementById('balance-display');
            if(!key) return alert('أدخل الـ API Key أولاً');
            display.innerText = 'جاري الفحص...';
            try {
                const res = await fetch(`${API_BASE}/user`, { headers: { 'Authorization': `Bearer ${key}` } });
                if(res.ok) {
                    const data = await res.json();
                    display.innerText = `${data.credits || data.balance || 'غير معروف'}`;
                } else {
                    display.innerText = 'خطأ في المفتاح';
                }
            } catch {
                display.innerText = 'فشل الاتصال';
            }
        }

        // حفظ الإعدادات
        function saveSettings() {
            const val = document.getElementById('api-key-input').value.trim();
            if(val) {
                API_KEY = val;
                localStorage.setItem('viggle_api_key', API_KEY);
                alert('تم حفظ مفتاح API بنجاح!');
                showView('home-view');
            }
        }

        // إدارة سجل المهام (Profile)
        function getTasks() { return JSON.parse(localStorage.getItem('viggle_tasks') || '[]'); }
        function saveTasks(tasks) { localStorage.setItem('viggle_tasks', JSON.stringify(tasks)); }
        
        function renderTasks() {
            const list = document.getElementById('tasks-list'); 
            const tasks = getTasks();
            if (tasks.length === 0) { 
                list.innerHTML = `<div class="text-center text-gray-500 mt-10">لا توجد مهام حتى الآن.</div>`; 
                return; 
            }
            list.innerHTML = tasks.map(t => `
                <div class="bg-[#1e293b] p-4 rounded-xl border border-gray-700">
                    <h3 class="font-bold text-sm text-white mb-2">${t.title}</h3>
                    <p class="text-[10px] text-gray-400 mb-3 truncate">${t.prompt}</p>
                    ${t.resultUrl ? `<button onclick="openService('${t.serviceId}', '${t.title}')" class="w-full bg-gray-700 text-white text-xs py-2 rounded-lg font-bold">عرض النتيجة</button>` : `<div class="text-[10px] text-yellow-400">⏳ جاري المعالجة...</div>`}
                </div>
            `).join('');
        }

        // التحميل (Modal)
        let downloadAbortController = null;
        async function downloadFile(url, filename) {
            document.getElementById('dl-title').innerText = filename; 
            document.getElementById('dl-progress').style.width = '0%'; 
            document.getElementById('dl-percent').innerText = '0%'; 
            document.getElementById('dl-size').innerText = '0 MB / 0 MB'; 
            document.getElementById('dl-status').innerText = 'جاري الاتصال...';
            
            try {
                downloadAbortController = new AbortController(); 
                const response = await fetch(url, { signal: downloadAbortController.signal }); 
                if (!response.ok) throw new Error('فشل');
                const contentLength = response.headers.get('content-length'); 
                const total = parseInt(contentLength || '0', 10); 
                const reader = response.body.getReader(); 
                const chunks = []; 
                let received = 0; 
                let lastTime = Date.now(); 
                let lastReceived = 0;
                
                document.getElementById('dl-status').innerText = 'جاري التحميل...';
                while (true) {
                    const { done, value } = await reader.read(); 
                    if (done) break; 
                    chunks.push(value); 
                    received += value.length;
                    const now = Date.now(); 
                    const timeDiff = (now - lastTime) / 1000;
                    if (timeDiff >= 0.1) { 
                        const speed = (received - lastReceived) / timeDiff; 
                        const totalMB = (total / (1024 * 1024)).toFixed(2); 
                        const receivedMB = (received / (1024 * 1024)).toFixed(2); 
                        const speedMB = (speed / (1024 * 1024)).toFixed(2); 
                        const percent = total ? Math.round((received / total) * 100) : 0; 
                        document.getElementById('dl-progress').style.width = `${percent}%`; 
                        document.getElementById('dl-percent').innerText = `${percent}%`; 
                        document.getElementById('dl-size').innerText = `${receivedMB} MB / ${totalMB} MB`; 
                        document.getElementById('dl-status').innerText = `${speedMB} MB/s`; 
                        lastTime = now; lastReceived = received; 
                    }
                }
                document.getElementById('dl-status').innerText = 'تم التحميل!'; 
                const blob = new Blob(chunks); 
                const blobUrl = URL.createObjectURL(blob); 
                const a = document.createElement('a'); 
                a.href = blobUrl; 
                a.download = filename; 
                document.body.appendChild(a); 
                a.click(); 
                document.body.removeChild(a); 
                URL.revokeObjectURL(blobUrl); 
                setTimeout(() => {
                    document.getElementById('download-modal').classList.add('hidden');
                    document.getElementById('download-modal').classList.remove('flex');
                }, 2000);
            } catch (error) { 
                if (error.name === 'AbortError') return; 
                document.getElementById('dl-status').innerText = 'حدث خطأ!'; 
            }
        }
    </script>
